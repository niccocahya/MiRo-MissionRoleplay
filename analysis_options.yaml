# Aturan lint MiRO (docs/standards/CODE_QUALITY.md §1).
#
# Aturan baru ini aktif untuk semua file, tetapi pelanggaran di kode lama
# hanya diperbaiki saat file itu disentuh (DECISIONS §H12). Jumlah temuan
# `flutter analyze` dicatat di docs/LINT_BASELINE.md dan tidak boleh naik.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    avoid_print: true
    require_trailing_commas: true
    use_build_context_synchronously: true
    always_declare_return_types: true

analyzer:
  exclude:
    - build/**
    - design/**
    - "**/*.g.dart"
