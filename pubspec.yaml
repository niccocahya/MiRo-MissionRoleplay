name: miro_app
description: "MiRO - Educational Learning App for Kids"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

# ==================== DEPENDENCIES ====================
dependencies:
  flutter:
    sdk: flutter

  # ==================== UI & DESIGN ====================
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  fl_chart: ^1.2.0

  # ==================== ROUTING & STATE MANAGEMENT ====================
  go_router: ^17.2.2
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  hooks_riverpod: ^3.3.1

  # ==================== DATA & SERIALIZATION ====================
  json_annotation: ^4.11.0
  intl: ^0.20.2

  # ==================== BACKEND & API ====================
  http: ^1.6.0
  supabase_flutter: ^2.12.4

  # ==================== LOCAL STORAGE ====================
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1

  # ==================== FEATURES ====================
  flutter_tts: ^4.2.5
  image_picker: ^1.2.2
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  gal: ^2.3.2

# ==================== DEV DEPENDENCIES ====================
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  json_serializable: ^6.7.1

# ==================== FLUTTER CONFIGURATION ====================
flutter:
  uses-material-design: true

  # ==================== ASSETS ====================
  assets:
    - assets/images/
    # - assets/sounds/ (uncomment jika ada)
    # - assets/animations/ (uncomment jika ada)

