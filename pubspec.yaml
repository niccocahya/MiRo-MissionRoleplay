name: miro_app
description: "MiRO - Educational Learning App for Kids"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

# ==================== DEPENDENCIES ====================
dependencies:
  flutter:
    sdk: flutter

  # ==================== UI & DESIGN ====================
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  fl_chart: ^1.2.0
  confetti: ^0.8.0

  # ==================== ROUTING & STATE MANAGEMENT ====================
  go_router: ^17.2.2
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  hooks_riverpod: ^3.3.1

  # ==================== DATA & SERIALIZATION ====================
  json_annotation: ^4.11.0
  intl: ^0.20.2

  # ==================== BACKEND & API ====================
  supabase_flutter: ^2.12.4

  # ==================== LOCAL STORAGE ====================
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1

  # ==================== FEATURES ====================
  flutter_tts: ^4.2.5
  image_picker: ^1.2.2
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  gal: ^2.3.2
  pdf: ^3.11.3
  printing: ^5.14.2
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.3.4
  flutter_image_compress: ^2.5.1

# ==================== DEV DEPENDENCIES ====================
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

# Ikon aplikasi: logo MiRO baru (DECISIONS B18). Jalankan
# `dart run flutter_launcher_icons` setelah mengubah baris ini.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/brand/miro-launcher-1024.png"
  adaptive_icon_background: "#FFE8B6"
  adaptive_icon_foreground: "assets/brand/miro-adaptive-foreground-1024.png"
  min_sdk_android: 21
  # App Store menolak ikon dengan alpha channel.
  remove_alpha_ios: true
  background_color_ios: "#FFE8B6"

# ==================== FLUTTER CONFIGURATION ====================
flutter:
  uses-material-design: true

  # ==================== ASSETS ====================
  assets:
    - assets/images/
    - assets/mascot/
    - assets/brand/
    - assets/google_fonts/
    # - assets/sounds/ (uncomment jika ada)
    # - assets/animations/ (uncomment jika ada)

  # ==================== FONTS ====================
  # Nunito dibundel (DECISIONS B16). Hanya 600 sampai 900; bobot lain di
  # layar lama otomatis memakai bobot terdekat.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/google_fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/Nunito-Black.ttf
          weight: 900