<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Setup anak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B24A34;text-decoration:none}a:hover{color:#8f3a28}
.press{transition:transform 80ms ease-out, box-shadow 80ms ease-out;cursor:pointer}
.press:active{transform:translateY(4px);box-shadow:none !important}
.popin{animation:popin 460ms cubic-bezier(.34,1.56,.64,1) both}
.rise{animation:rise 420ms cubic-bezier(.22,1,.36,1) both}
.floaty{animation:floaty 2.4s ease-in-out .6s 3}
.grow-x{transform-origin:left center;animation:growx 900ms cubic-bezier(.22,1,.36,1) .35s both}
@keyframes popin{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:linear-gradient(180deg,#A5CBEB 0%,#D3E3F2 55%,#E9DFCE 100%);font-family:Nunito, system-ui, sans-serif;color:#0A264F;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div style="height:64px;flex-shrink:0;padding:8px 20px 0;box-sizing:border-box;display:flex;align-items:center;gap:14px"><a href="Masuk.dc.html" aria-label="Kembali" class="press" style="width:44px;height:44px;flex-shrink:0;border-radius:9999px;background:rgba(255,255,255,.75);border:2px solid #D5DEEA;box-shadow:0 2px 0 #D5DEEA;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A264F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a><div role="progressbar" aria-label="Langkah 4 dari 7" style="flex:1;height:16px;border-radius:9999px;background:rgba(255,255,255,.6);overflow:hidden"><div style="width:57%;height:100%;border-radius:9999px;background:#22C55E;position:relative"><div style="position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9999px;background:rgba(255,255,255,.4)"></div></div></div></div>
  <div style="position:relative;padding:6px 20px 0;display:flex;align-items:flex-end;gap:6px">
    <img class="floaty" src="/mascot/maro-main.webp" alt="Maro" style="width:78px;height:110px;object-fit:contain;flex-shrink:0">
    <div class="popin" style="transform-origin:left bottom;position:relative;margin-bottom:40px;background:#FFFFFF;border:2px solid #D5DEEA;border-radius:20px;padding:12px 14px;font-size:17px;line-height:23px;font-weight:800">Siapa nama pahlawan kecilmu?<span style="position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:#FFFFFF;border-left:2px solid #D5DEEA;border-bottom:2px solid #D5DEEA;transform:rotate(45deg)"></span></div>
  </div>
  <div style="padding:10px 20px 0;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:15px;font-weight:900">Pilih avatar</span>
      <div role="radiogroup" aria-label="Avatar" style="display:flex;gap:6px">
        <sc-for list="{{avs}}" as="a" hint-placeholder-count="6"><button role="radio" aria-checked="{{a.sel}}" aria-label="{{a.label}}" onClick="{{a.pick}}" class="press" style="{{a.style}}"><img src="/mascot/maro-peek.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 0;padding-top:16%;box-sizing:border-box;display:block"></button></sc-for>
        <button aria-label="Unggah foto" class="press" style="width:42px;height:42px;flex-shrink:0;border-radius:9999px;border:2px dashed #8BBCE6;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D7FB8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.5-2h6.4l1.5 2h1.8A2.5 2.5 0 0 1 21 8.5V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="cn" style="font-size:15px;font-weight:900">Nama panggilan</label>
      <input id="cn" value="Rafi" style="height:52px;box-sizing:border-box;border:2px solid #0A264F;box-shadow:0 0 0 4px #D3E3F2;border-radius:12px;padding:0 16px;font-family:inherit;font-size:17px;font-weight:800;color:#0A264F;background:#FFFFFF;outline:none">
      <span style="font-size:13px;font-weight:700;color:#3D5677">Cukup nama panggilan. Bisa diubah kapan saja.</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:15px;font-weight:900">Berapa usianya?</span>
      <div role="radiogroup" aria-label="Usia" style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:8px">
        <sc-for list="{{ages}}" as="g" hint-placeholder-count="9"><button role="radio" aria-checked="{{g.sel}}" onClick="{{g.pick}}" class="press" style="{{g.style}}">{{g.n}}</button></sc-for>
        <span style="display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#5B6F8A">tahun</span>
      </div>
    </div>
  </div>
  <div style="margin-top:auto;padding:16px 20px 28px"><a href="Kesukaan.dc.html" class="press" style="height:56px;border-radius:16px;background:#D9654E;box-shadow:0 4px 0 #B24A34;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase">Lanjut</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { av: 0, age: 6 }; }
  renderVals() {
    const bgs = ['#D3E3F2','#FBEBE8','#E8F2E6','#F6F0FA','#FFE8B6','#FAF0F0'];
    const avs = bgs.map((bg, i) => { const on = this.state.av === i; return { sel: on ? 'true' : 'false', label: 'Avatar ' + (i + 1), pick: () => this.setState({ av: i }),
      style: 'width:42px;height:42px;flex-shrink:0;padding:0;border-radius:9999px;overflow:hidden;background:' + bg + ';' + (on ? 'border:3px solid #E57B65;box-shadow:0 3px 0 #B24A34;transform:scale(1.06)' : 'border:2px solid #D5DEEA;box-shadow:0 2px 0 #D5DEEA') + ';transition:transform 200ms cubic-bezier(.34,1.56,.64,1)' }; });
    const ages = [2,3,4,5,6,7,8,9,10].map((n) => { const on = this.state.age === n; return { n, sel: on ? 'true' : 'false', pick: () => this.setState({ age: n }),
      style: 'height:48px;border-radius:14px;font-family:inherit;font-size:17px;font-weight:900;' + (on ? 'background:#0A264F;color:#FFFFFF;border:2px solid #0A264F;box-shadow:0 3px 0 #04152E' : 'background:#FFFFFF;color:#0A264F;border:2px solid #D5DEEA;box-shadow:0 3px 0 #D5DEEA') }; });
    return { avs, ages };
  }
}
</script>
</body>
</html>
