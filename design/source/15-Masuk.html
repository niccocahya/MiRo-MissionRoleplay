<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Masuk atau daftar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B24A34;text-decoration:none}a:hover{color:#8f3a28}
.press{transition:transform 80ms ease-out, box-shadow 80ms ease-out;cursor:pointer}
.press:active{transform:translateY(4px);box-shadow:none !important}
.popin{animation:popin 460ms cubic-bezier(.34,1.56,.64,1) both}
.rise{animation:rise 420ms cubic-bezier(.22,1,.36,1) both}
.floaty{animation:floaty 2.4s ease-in-out .6s 3}
.grow-x{transform-origin:left center;animation:growx 900ms cubic-bezier(.22,1,.36,1) .35s both}
@keyframes popin{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F8FB;font-family:Nunito, system-ui, sans-serif;color:#0A264F;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div style="height:64px;flex-shrink:0;padding:8px 20px 0;box-sizing:border-box;display:flex;align-items:center;gap:14px"><a href="TipeAkun.dc.html" aria-label="Kembali" class="press" style="width:44px;height:44px;flex-shrink:0;border-radius:9999px;background:rgba(255,255,255,.75);border:2px solid #D5DEEA;box-shadow:0 2px 0 #D5DEEA;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A264F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a><div role="progressbar" aria-label="Langkah 3 dari 7" style="flex:1;height:16px;border-radius:9999px;background:rgba(255,255,255,.6);overflow:hidden"><div style="width:43%;height:100%;border-radius:9999px;background:#22C55E;position:relative"><div style="position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9999px;background:rgba(255,255,255,.4)"></div></div></div></div>
  <div style="padding:12px 20px 0;display:flex;flex-direction:column;gap:16px">
    <div role="tablist" style="display:flex;background:#E8EEF5;border-radius:14px;padding:4px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
    </div>
    <div class="rise" key="{{modeKey}}" style="display:flex;flex-direction:column;gap:4px">
      <h1 style="margin:0;font-size:28px;line-height:34px;font-weight:900">{{title}}</h1>
      <p style="margin:0;font-size:15px;font-weight:600;color:#3D5677">{{sub}}</p>
    </div>
    <sc-if value="{{isDaftar}}" hint-placeholder-val="{{true}}"><div style="display:flex;flex-direction:column;gap:6px">
      <label for="nm" style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#3D5677"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3D5677" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Nama panggilan</label>
      <input id="nm" type="text" placeholder="Contoh: Dinda" style="height:52px;box-sizing:border-box;border:2px solid #D5DEEA;border-radius:12px;padding:0 16px;font-family:inherit;font-size:15px;font-weight:700;color:#0A264F;background:#FFFFFF;outline:none">
    </div></sc-if>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="em" style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#3D5677"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3D5677" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>Email</label>
      <input id="em" type="email" value="bunda.dinda@gmail" aria-invalid="true" aria-describedby="em-err" style="height:52px;box-sizing:border-box;border:2px solid #E5484D;border-radius:12px;padding:0 16px;font-family:inherit;font-size:15px;font-weight:700;color:#0A264F;background:#FFFFFF;outline:none">
      <span id="em-err" style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#B42318"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/></svg>Ups, emailnya belum lengkap. Contoh: nama@gmail.com</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="pw" style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#3D5677"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3D5677" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Kata sandi</label>
      <div style="position:relative"><input id="pw" type="{{pwType}}" value="rahasia123" style="width:100%;height:52px;box-sizing:border-box;border:2px solid #D5DEEA;border-radius:12px;padding:0 52px 0 16px;font-family:inherit;font-size:15px;font-weight:700;color:#0A264F;background:#FFFFFF;outline:none">
        <button onClick="{{togglePw}}" aria-label="{{pwAria}}" style="position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6F8A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-if value="{{pwShown}}" hint-placeholder-val="{{false}}"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></sc-if><sc-if value="{{pwHidden}}" hint-placeholder-val="{{true}}"><path d="M17.9 17.9A10 10 0 0 1 12 20C5 20 2 12 2 12a18 18 0 0 1 5-5.9M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.2"/><path d="m2 2 20 20"/></sc-if></svg></button></div>
    </div>
    <sc-if value="{{isMasuk}}" hint-placeholder-val="{{false}}"><a href="LupaSandi.dc.html" style="align-self:flex-end;font-size:13px;font-weight:800">Lupa kata sandi?</a></sc-if>
  </div>
  <div style="margin-top:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:12px">
    <a href="SetupAnak.dc.html" class="press" style="height:56px;border-radius:16px;background:#D9654E;box-shadow:0 4px 0 #B24A34;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase">{{cta}}</a>
    <div style="display:flex;align-items:center;gap:10px" aria-hidden="true"><span style="flex:1;height:2px;background:#E8EEF5"></span><span style="font-size:13px;font-weight:800;color:#5B6F8A">atau</span><span style="flex:1;height:2px;background:#E8EEF5"></span></div>
    <a href="SetupAnak.dc.html" class="press" style="height:52px;border-radius:16px;background:#FFFFFF;border:2px solid #D5DEEA;box-shadow:0 4px 0 #D5DEEA;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:800;color:#0A264F"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Lanjutkan dengan Google</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { mode: 'daftar', show: false }; }
  renderVals() {
    const m = this.state.mode, d = m === 'daftar';
    const tabs = [['daftar','Daftar'],['masuk','Masuk']].map(([id, label]) => ({ label, sel: m === id ? 'true' : 'false', pick: () => this.setState({ mode: id }),
      style: 'flex:1;height:40px;border:0;border-radius:10px;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;' + (m === id ? 'background:#FFFFFF;color:#0A264F;box-shadow:0 2px 0 #D5DEEA' : 'background:transparent;color:#5B6F8A') }));
    return { tabs, modeKey: m, isDaftar: d, isMasuk: !d,
      title: d ? 'Buat akun Orang Tua' : 'Selamat datang kembali!', sub: d ? 'Hanya butuh satu menit.' : 'Lanjutkan petualangan si kecil.',
      cta: d ? 'Buat akun' : 'Masuk',
      pwType: this.state.show ? 'text' : 'password', pwShown: this.state.show, pwHidden: !this.state.show,
      pwAria: this.state.show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi',
      togglePw: () => this.setState({ show: !this.state.show }) };
  }
}
</script>
</body>
</html>
