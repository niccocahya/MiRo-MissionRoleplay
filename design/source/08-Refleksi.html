<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Refleksi misi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B24A34;text-decoration:none}a:hover{color:#8f3a28}
.press{transition:transform 80ms ease-out, box-shadow 80ms ease-out;cursor:pointer}
.press:active{transform:translateY(4px);box-shadow:none !important}
.popin{animation:popin 460ms cubic-bezier(.34,1.56,.64,1) both}
.rise{animation:rise 420ms cubic-bezier(.22,1,.36,1) both}
.floaty{animation:floaty 2.4s ease-in-out .6s 3}
.grow-x{transform-origin:left center;animation:growx 900ms cubic-bezier(.22,1,.36,1) .35s both}
@keyframes popin{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F8FB;font-family:Nunito, system-ui, sans-serif;color:#0A264F;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div style="height:64px;flex-shrink:0;padding:8px 20px 0;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between">
    <span style="display:flex;align-items:center;gap:8px;background:#EBF4FA;border-radius:9999px;padding:4px 12px 4px 4px"><span style="width:28px;height:28px;border-radius:9999px;background:#FFFFFF;overflow:hidden;display:block"><img src="/mascot/maro-chef-win.webp" alt="" style="width:100%;height:140%;object-fit:cover;object-position:50% 8%;display:block"></span><span style="font-size:13px;font-weight:800;color:#1E467A">Membuat Bola Biskuit</span></span>
    <a href="Main.dc.html" style="height:44px;display:flex;align-items:center;font-size:15px;font-weight:800;color:#5B6F8A">Lewati</a>
  </div>
  <div class="rise" style="padding:12px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:12px">
    <h1 style="margin:0;font-size:28px;line-height:34px;font-weight:900">Bagaimana misinya?</h1>
    <span style="flex-shrink:0;display:flex;align-items:center;gap:4px;background:#FEF7EE;border:2px solid #F5B555;border-radius:9999px;padding:4px 10px;font-size:13px;font-weight:900;color:#8A5608"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.5 2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8Z" fill="#F1A22F"/></svg>+5 XP</span>
  </div>

  <!-- perasaan bunda -->
  <div style="padding:16px 20px 0">
    <div style="background:#FFFFFF;border:2px solid #D5DEEA;border-radius:20px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:17px;font-weight:900">Perasaan Bunda</span><span style="font-size:13px;font-weight:900;color:#B24A34">{{parentLabel}}</span></div>
      <div role="radiogroup" aria-label="Perasaan Bunda" style="display:flex;justify-content:space-between">
        <sc-for list="{{parentFaces}}" as="f" hint-placeholder-count="5">
          <button role="radio" aria-checked="{{f.checked}}" aria-label="{{f.label}}" onClick="{{f.pick}}" style="{{f.style}}"><sc-if value="{{f.is0}}" hint-placeholder-val="{{false}}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#9DB2DD"/><ellipse cx="22" cy="25" rx="15.5" ry="14" fill="#FFF6E8"/><path d="M14 21q2-2 4 0M26 21q2-2 4 0" stroke="#0A264F" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M13 17.5l5 1.5M31 17.5l-5 1.5" stroke="#0A264F" stroke-width="1.6" stroke-linecap="round"/><path d="M19.5 27h5l-2.5 2.6Z" fill="#F1A22F" transform="rotate(180 22 28)"/></svg></sc-if><sc-if value="{{f.is1}}" hint-placeholder-val="{{false}}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#9DB2DD"/><ellipse cx="22" cy="25" rx="15.5" ry="14" fill="#FFF6E8"/><circle cx="16" cy="21" r="2" fill="#0A264F"/><circle cx="28" cy="21" r="2" fill="#0A264F"/><path d="M19.5 26h5l-2.5 3Z" fill="#F1A22F"/></svg></sc-if><sc-if value="{{f.is2}}" hint-placeholder-val="{{true}}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#9DB2DD"/><ellipse cx="22" cy="25" rx="15.5" ry="14" fill="#FFF6E8"/><circle cx="16" cy="21" r="2.2" fill="#0A264F"/><circle cx="28" cy="21" r="2.2" fill="#0A264F"/><path d="M18.5 31q3.5 2 7 0" stroke="#0A264F" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M19.5 26h5l-2.5 3Z" fill="#F1A22F"/></svg></sc-if><sc-if value="{{f.is3}}" hint-placeholder-val="{{false}}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#9DB2DD"/><ellipse cx="22" cy="25" rx="15.5" ry="14" fill="#FFF6E8"/><path d="M13.5 22q2.5-3 5 0M25.5 22q2.5-3 5 0" stroke="#0A264F" stroke-width="2.2" fill="none" stroke-linecap="round"/><ellipse cx="12" cy="27" rx="2.4" ry="1.4" fill="#F4C6BC"/><ellipse cx="32" cy="27" rx="2.4" ry="1.4" fill="#F4C6BC"/><path d="M18.5 26h7q-1 4-3.5 4t-3.5-4Z" fill="#F1A22F"/><path d="M20 28q2 1.4 4 0" stroke="#D9654E" stroke-width="1.2" fill="none"/></svg></sc-if><sc-if value="{{f.is4}}" hint-placeholder-val="{{false}}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#9DB2DD"/><ellipse cx="22" cy="25" rx="15.5" ry="14" fill="#FFF6E8"/><circle cx="16" cy="21" r="3.6" fill="#0A264F"/><circle cx="28" cy="21" r="3.6" fill="#0A264F"/><circle cx="17.2" cy="19.8" r="1.3" fill="#FFFFFF"/><circle cx="29.2" cy="19.8" r="1.3" fill="#FFFFFF"/><ellipse cx="11.5" cy="27.5" rx="2.6" ry="1.5" fill="#F4C6BC"/><ellipse cx="32.5" cy="27.5" rx="2.6" ry="1.5" fill="#F4C6BC"/><path d="M18 25.5h8q-1 5-4 5t-4-5Z" fill="#F1A22F"/><path d="M19.6 28.2q2.4 1.6 4.8 0" stroke="#D9654E" stroke-width="1.3" fill="none"/></svg></sc-if></button>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- perasaan anak -->
  <div style="padding:14px 20px 0">
    <div style="background:#FFFFFF;border:2px solid #D5DEEA;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:17px;font-weight:900">Perasaan anak</span>
        <button onClick="{{toggleSame}}" role="switch" aria-checked="{{sameAria}}" style="display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 0;font-family:inherit;font-size:13px;font-weight:800;color:#3D5677;cursor:pointer">Sama untuk semua<span style="{{switchStyle}}"><span style="{{knobStyle}}"></span></span></button>
      </div>
      <sc-for list="{{kids}}" as="k" hint-placeholder-count="2">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="width:56px;display:flex;flex-direction:column;align-items:center;gap:2px"><span style="width:36px;height:36px;flex-shrink:0;border-radius:9999px;background:{{k.bg}};border:2px solid #FFFFFF;box-sizing:border-box;overflow:hidden;display:block;"><img src="/mascot/maro-peek.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 0;padding-top:16%;box-sizing:border-box;display:block"></span><span style="font-size:12px;font-weight:900">{{k.name}}</span></span>
          <div role="radiogroup" aria-label="{{k.aria}}" style="flex:1;display:flex;justify-content:space-between">
            <sc-for list="{{k.faces}}" as="f" hint-placeholder-count="5">
              <button role="radio" aria-checked="{{f.checked}}" aria-label="{{f.label}}" onClick="{{f.pick}}" style="{{f.style}}"><sc-if value="{{f.is0}}" hint-placeholder-val="{{false}}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#9DB2DD"/><ellipse cx="22" cy="25" rx="15.5" ry="14" fill="#FFF6E8"/><path d="M14 21q2-2 4 0M26 21q2-2 4 0" stroke="#0A264F" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M13 17.5l5 1.5M31 17.5l-5 1.5" stroke="#0A264F" stroke-width="1.6" stroke-linecap="round"/><path d="M19.5 27h5l-2.5 2.6Z" fill="#F1A22F" transform="rotate(180 22 28)"/></svg></sc-if><sc-if value="{{f.is1}}" hint-placeholder-val="{{false}}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#9DB2DD"/><ellipse cx="22" cy="25" rx="15.5" ry="14" fill="#FFF6E8"/><circle cx="16" cy="21" r="2" fill="#0A264F"/><circle cx="28" cy="21" r="2" fill="#0A264F"/><path d="M19.5 26h5l-2.5 3Z" fill="#F1A22F"/></svg></sc-if><sc-if value="{{f.is2}}" hint-placeholder-val="{{true}}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#9DB2DD"/><ellipse cx="22" cy="25" rx="15.5" ry="14" fill="#FFF6E8"/><circle cx="16" cy="21" r="2.2" fill="#0A264F"/><circle cx="28" cy="21" r="2.2" fill="#0A264F"/><path d="M18.5 31q3.5 2 7 0" stroke="#0A264F" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M19.5 26h5l-2.5 3Z" fill="#F1A22F"/></svg></sc-if><sc-if value="{{f.is3}}" hint-placeholder-val="{{false}}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#9DB2DD"/><ellipse cx="22" cy="25" rx="15.5" ry="14" fill="#FFF6E8"/><path d="M13.5 22q2.5-3 5 0M25.5 22q2.5-3 5 0" stroke="#0A264F" stroke-width="2.2" fill="none" stroke-linecap="round"/><ellipse cx="12" cy="27" rx="2.4" ry="1.4" fill="#F4C6BC"/><ellipse cx="32" cy="27" rx="2.4" ry="1.4" fill="#F4C6BC"/><path d="M18.5 26h7q-1 4-3.5 4t-3.5-4Z" fill="#F1A22F"/><path d="M20 28q2 1.4 4 0" stroke="#D9654E" stroke-width="1.2" fill="none"/></svg></sc-if><sc-if value="{{f.is4}}" hint-placeholder-val="{{false}}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#9DB2DD"/><ellipse cx="22" cy="25" rx="15.5" ry="14" fill="#FFF6E8"/><circle cx="16" cy="21" r="3.6" fill="#0A264F"/><circle cx="28" cy="21" r="3.6" fill="#0A264F"/><circle cx="17.2" cy="19.8" r="1.3" fill="#FFFFFF"/><circle cx="29.2" cy="19.8" r="1.3" fill="#FFFFFF"/><ellipse cx="11.5" cy="27.5" rx="2.6" ry="1.5" fill="#F4C6BC"/><ellipse cx="32.5" cy="27.5" rx="2.6" ry="1.5" fill="#F4C6BC"/><path d="M18 25.5h8q-1 5-4 5t-4-5Z" fill="#F1A22F"/><path d="M19.6 28.2q2.4 1.6 4.8 0" stroke="#D9654E" stroke-width="1.3" fill="none"/></svg></sc-if></button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- catatan -->
  <div style="padding:14px 20px 0;display:flex;flex-direction:column;gap:6px">
    <label for="note" style="font-size:15px;font-weight:900">Catatan singkat <span style="font-weight:700;color:#5B6F8A">(opsional)</span></label>
    <textarea id="note" rows="3" placeholder="Contoh: Rafi paling suka bagian menghancurkan biskuit." style="width:100%;box-sizing:border-box;resize:none;border:2px solid #D5DEEA;border-radius:16px;padding:12px 14px;font-family:inherit;font-size:15px;font-weight:700;color:#0A264F;background:#FFFFFF;outline:none"></textarea>
  </div>

  <div style="margin:16px 20px 0;display:flex;gap:10px;align-items:flex-start;background:#EBF4FA;border-radius:16px;padding:12px 14px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D7FB8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    <span style="font-size:13px;line-height:19px;font-weight:700;color:#1E467A">Jawabanmu membantu Maro memilih misi yang paling disukai Rafi dan Nara berikutnya.</span>
  </div>
  <div style="margin-top:auto;padding:16px 20px 28px"><a href="LencanaBaru.dc.html" class="press" style="height:56px;border-radius:16px;background:#D9654E;box-shadow:0 4px 0 #B24A34;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase">Simpan</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { parent: 3, rafi: 4, nara: 3, same: false }; }
  renderVals() {
    const L = ['Kurang seru', 'Biasa', 'Seru', 'Seru banget', 'Luar biasa!'];
    const mk = (who, cur, size, pad) => [0,1,2,3,4].map((k) => {
      const on = cur === k;
      const o = { size, checked: on ? 'true' : 'false', label: L[k],
        pick: () => { const u = {}; if (this.state.same && who !== 'parent') { u.rafi = k; u.nara = k; } else { u[who] = k; } this.setState(u); },
        style: 'width:' + (size + pad) + 'px;height:' + (size + pad) + 'px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:' + (on ? '#FFE8B6' : 'transparent') + ';border:' + (on ? '2px solid #E57B65' : '2px solid transparent') + ';box-sizing:border-box;padding:0;cursor:pointer;transition:transform 200ms cubic-bezier(.34,1.56,.64,1), filter 200ms;' + (on ? 'transform:scale(1.08)' : 'filter:grayscale(1);opacity:.55')
      };
      [0,1,2,3,4].forEach((j) => { o['is' + j] = j === k; });
      return o;
    });
    const s = this.state;
    const kids = [['rafi','Rafi','#D3E3F2'],['nara','Nara','#FBEBE8']].map(([id, name, bg]) => ({ name, bg, aria: 'Perasaan ' + name, faces: mk(id, s[id], 36, 10) }));
    return {
      parentFaces: mk('parent', s.parent, 48, 8), parentLabel: L[s.parent], kids,
      sameAria: s.same ? 'true' : 'false',
      toggleSame: () => this.setState({ same: !s.same, nara: !s.same ? s.rafi : s.nara }),
      switchStyle: 'width:40px;height:24px;border-radius:9999px;position:relative;display:block;transition:background 200ms;background:' + (s.same ? '#5C9FD6' : '#D5DEEA'),
      knobStyle: 'position:absolute;top:3px;width:18px;height:18px;border-radius:9999px;background:#FFFFFF;transition:left 200ms;left:' + (s.same ? '19px' : '3px')
    };
  }
}
</script>
</body>
</html>
