<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pilih peserta misi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B24A34;text-decoration:none}a:hover{color:#8f3a28}
.press{transition:transform 80ms ease-out, box-shadow 80ms ease-out;cursor:pointer}
.press:active{transform:translateY(4px);box-shadow:none !important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F8FB;font-family:Nunito, system-ui, sans-serif;color:#0A264F;position:relative;overflow:hidden;display:flex;flex-direction:column">

  <div style="height:64px;padding:8px 20px 0;box-sizing:border-box;display:flex;align-items:center;gap:12px">
    <a href="Main.dc.html" aria-label="Kembali" class="press" style="width:44px;height:44px;flex-shrink:0;border-radius:9999px;background:#FFFFFF;border:2px solid #D5DEEA;box-shadow:0 2px 0 #D5DEEA;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A264F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <span style="font-size:15px;font-weight:800;color:#3D5677">Misi 3 dari 5</span>
  </div>

  <!-- ringkasan misi -->
  <div style="padding:12px 20px 0">
    <div style="position:relative;height:112px;box-sizing:border-box;background:#EBF4FA;border:2px solid #5C9FD6;box-shadow:0 4px 0 #3D7FB8;border-radius:20px;padding:14px 16px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:4px">
      <span aria-hidden="true" style="position:absolute;right:40px;top:-30px;width:110px;height:110px;border-radius:9999px;background:#D3E3F2"></span>
      <img src="/mascot/maro-chef-win.webp" alt="" style="position:absolute;right:6px;bottom:-18px;width:96px;height:118px;object-fit:contain">
      <span style="position:relative;font-size:13px;font-weight:800;color:#1E467A">Koki Kecil</span>
      <span style="position:relative;font-size:20px;line-height:24px;font-weight:900">Membuat Bola Biskuit</span>
      <span style="position:relative;align-self:flex-start;font-size:12px;font-weight:800;background:#FFFFFF;border-radius:9999px;padding:3px 10px">15 menit</span>
    </div>
  </div>

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-size:24px;line-height:30px;font-weight:900">Siapa yang ikut main?</h1>
    <p style="margin:0;font-size:15px;line-height:22px;font-weight:600;color:#3D5677">XP dan poin keahlian masuk ke setiap anak yang ikut, tidak dibagi.</p>
  </div>

  <div style="padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13px;font-weight:700;color:#5B6F8A">{{countLabel}}</span>
    <button onClick="{{toggleAll}}" style="background:none;border:0;padding:10px 0;font-family:inherit;font-size:15px;font-weight:800;color:#B24A34;cursor:pointer">{{allLabel}}</button>
  </div>

  <div style="padding:8px 20px 0;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px">
    <sc-for list="{{kids}}" as="k" hint-placeholder-count="3">
      <button onClick="{{k.toggle}}" aria-pressed="{{k.pressed}}" class="press" style="{{k.cardStyle}}">
        <span style="position:relative;width:76px;height:76px">
          <span style="{{k.ringStyle}}">
            <img src="/mascot/maro-peek.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 0;padding-top:16%;box-sizing:border-box;display:block">
          </span>
          <span style="{{k.checkStyle}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
        </span>
        <span style="font-size:17px;font-weight:900;color:#0A264F">{{k.name}}</span>
        <span style="font-size:13px;font-weight:700;color:#5B6F8A">{{k.age}} tahun</span>
        <sc-if value="{{k.outOfRange}}" hint-placeholder-val="{{false}}">
          <span style="font-size:12px;font-weight:800;color:#8A5608;background:#FFE8B6;border-radius:9999px;padding:2px 8px">Misi 4+ tahun</span>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <!-- ringkasan hadiah -->
  <div style="padding:24px 20px 0">
    <div style="background:#FFFFFF;border:2px solid #D5DEEA;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px">
      <span style="font-size:15px;font-weight:900;color:#0A264F">Setiap anak yang ikut dapat</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span style="display:flex;align-items:center;gap:6px;background:#FEF7EE;border-radius:9999px;padding:6px 12px 6px 8px;font-size:15px;font-weight:900;color:#8A5608">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.5 2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8Z" fill="#F1A22F"/><path d="M8.5 9.5 10 8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>+20 XP</span>
        <span style="display:flex;align-items:center;gap:6px;background:#EBF4FA;border-radius:9999px;padding:6px 12px 6px 8px;font-size:15px;font-weight:800;color:#0A264F">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D7FB8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10M10 9.5V4a1.5 1.5 0 0 1 3 0v6M13 10V5.5a1.5 1.5 0 0 1 3 0V12M16 9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7c-3 0-4.5-1.5-6.5-4L4 14.5a1.6 1.6 0 0 1 2.5-2L7 13"/></svg>Motorik +3</span>
        <span style="display:flex;align-items:center;gap:6px;background:#E8EEF5;border-radius:9999px;padding:6px 12px 6px 8px;font-size:15px;font-weight:800;color:#0A264F">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A264F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3A2.5 2.5 0 0 0 7 5.5 3 3 0 0 0 4.5 9a3 3 0 0 0 .5 5.5A3 3 0 0 0 9 19a2.5 2.5 0 0 0 3 1.5V4.5A2.5 2.5 0 0 0 9.5 3ZM14.5 3A2.5 2.5 0 0 1 17 5.5 3 3 0 0 1 19.5 9a3 3 0 0 1-.5 5.5A3 3 0 0 1 15 19a2.5 2.5 0 0 1-3 1.5"/></svg>Kognitif +2</span>
      </div>
    </div>
  </div>

  <div style="margin-top:auto;padding:16px 20px 28px">
    <sc-if value="{{hasKids}}" hint-placeholder-val="{{true}}">
      <a href="Misi.dc.html" class="press" style="height:56px;border-radius:16px;background:#D9654E;box-shadow:0 4px 0 #B24A34;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase">{{cta}}</a>
    </sc-if>
    <sc-if value="{{noKids}}" hint-placeholder-val="{{false}}">
      <button disabled style="width:100%;height:56px;border:0;border-radius:16px;background:#E8EEF5;box-shadow:0 4px 0 #D5DEEA;color:#A3B1C4;font-family:inherit;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase">Pilih minimal 1 anak</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: { rafi: true, nara: true, dimas: false } }; }
  renderVals() {
    const sel = this.state.sel;
    const list = [
      { id: 'rafi', name: 'Rafi', age: 6, bg: '#D3E3F2' },
      { id: 'nara', name: 'Nara', age: 3, bg: '#FBEBE8' },
      { id: 'dimas', name: 'Dimas', age: 8, bg: '#E8F2E6' }
    ];
    const n = list.filter((k) => sel[k.id]).length;
    const all = n === list.length;
    const kids = list.map((k) => {
      const on = !!sel[k.id];
      return Object.assign({}, k, {
        pressed: on ? 'true' : 'false', outOfRange: k.age < 4,
        toggle: () => this.setState({ sel: Object.assign({}, sel, { [k.id]: !on }) }),
        cardStyle: 'display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px 12px;border-radius:20px;font-family:inherit;' + (on ? 'background:#FFE8B6;border:2px solid #E57B65;box-shadow:0 4px 0 #E57B65' : 'background:#FFFFFF;border:2px solid #D5DEEA;box-shadow:0 4px 0 #D5DEEA'),
        ringStyle: 'display:block;width:76px;height:76px;border-radius:9999px;overflow:hidden;box-sizing:border-box;background:' + k.bg + ';transition:transform 200ms cubic-bezier(.34,1.56,.64,1);' + (on ? 'border:4px solid #E57B65;transform:scale(1.04)' : 'border:4px solid transparent'),
        checkStyle: 'position:absolute;right:-2px;bottom:0;width:26px;height:26px;border-radius:9999px;background:#22C55E;border:3px solid #FFFFFF;display:flex;align-items:center;justify-content:center;transition:transform 200ms cubic-bezier(.34,1.56,.64,1);transform:scale(' + (on ? 1 : 0) + ')'
      });
    });
    return {
      kids, hasKids: n > 0, noKids: n === 0,
      countLabel: n + ' dari ' + list.length + ' anak dipilih',
      allLabel: all ? 'Batal pilih semua' : 'Pilih semua',
      toggleAll: () => { const v = !all; this.setState({ sel: { rafi: v, nara: v, dimas: v } }); },
      cta: 'Mulai dengan ' + n + ' anak'
    };
  }
}
</script>
</body>
</html>
