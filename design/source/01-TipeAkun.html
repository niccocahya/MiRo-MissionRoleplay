<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Onboarding, Pilih tipe akun</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B24A34;text-decoration:none}a:hover{color:#8f3a28}
.press{transition:transform 80ms ease-out, box-shadow 80ms ease-out;cursor:pointer}
.press:active{transform:translateY(4px);box-shadow:none !important}
.snow{background-image:url(/mascot/snow.webp);background-size:cover;opacity:.5}
.popin{animation:popin 460ms cubic-bezier(.34,1.56,.64,1) both}
.grow-x{transform-origin:left center;animation:growx 900ms cubic-bezier(.22,1,.36,1) .35s both}
.grow-y{transform-origin:center bottom;animation:growy 700ms cubic-bezier(.22,1,.36,1) both}
.floaty{animation:floaty 2.4s ease-in-out .6s 3}
.pulse{animation:pulse 1.4s ease-in-out .9s 3}
.shine{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-12deg);animation:shine 1.1s ease-out .5s 1 both}
@keyframes popin{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes shine{to{left:130%}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:linear-gradient(180deg,#A5CBEB 0%,#D3E3F2 55%,#E9DFCE 100%);font-family:Nunito, system-ui, sans-serif;color:#0A264F;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div class="snow" style="position:absolute;inset:0;pointer-events:none"></div>

  <!-- top bar: back + lesson bar -->
  <div style="position:relative;height:64px;padding:8px 20px 0;box-sizing:border-box;display:flex;align-items:center;gap:14px">
    <button aria-label="Kembali" class="press" style="width:44px;height:44px;flex-shrink:0;border-radius:9999px;background:rgba(255,255,255,.75);border:2px solid #D5DEEA;box-shadow:0 2px 0 #D5DEEA;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A264F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div role="progressbar" aria-valuenow="2" aria-valuemin="0" aria-valuemax="7" aria-label="Langkah 2 dari 7" style="flex:1;height:16px;border-radius:9999px;background:rgba(255,255,255,.6);overflow:hidden">
      <div style="width:28%;height:100%;border-radius:9999px;background:#22C55E;position:relative"><div style="position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9999px;background:rgba(255,255,255,.4)"></div></div>
    </div>
  </div>

  <!-- Maro + balon -->
  <div style="position:relative;padding:12px 20px 0;display:flex;align-items:flex-end;gap:8px">
    <img class="floaty" src="/mascot/maro-wave.webp" alt="Maro melambai" style="width:116px;height:142px;object-fit:contain;flex-shrink:0">
    <div class="popin" style="transform-origin:left bottom;animation-delay:.2s;position:relative;z-index:1;margin-left:4px;margin-bottom:62px;background:#FFFFFF;border:2px solid #D5DEEA;border-radius:20px;padding:14px 16px;font-size:17px;line-height:24px;font-weight:800">
      Hai, aku Maro! Siapa yang akan bermain bersamaku?
      <span style="position:absolute;left:-10px;bottom:18px;width:16px;height:16px;background:#FFFFFF;border-left:2px solid #D5DEEA;border-bottom:2px solid #D5DEEA;transform:rotate(45deg)"></span>
    </div>
  </div>

  <!-- pilihan -->
  <div style="position:relative;padding:20px 20px 0;display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
      <button class="press" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.cardStyle}}">
       <span style="display:flex;align-items:center;gap:14px;width:100%">
        <span style="{{o.tileStyle}}">
          <sc-if value="{{o.isParent}}" hint-placeholder-val="{{true}}">
            <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="3" fill="{{o.iconFill}}"/><path d="M3.5 20v-3a5.5 5.5 0 0 1 11 0v3Z" fill="{{o.iconFill}}"/><circle cx="17.5" cy="10" r="2.3" fill="{{o.iconFill}}" opacity=".7"/><path d="M14.5 20v-2.2a3 3 0 0 1 6 0V20Z" fill="{{o.iconFill}}" opacity=".7"/></svg>
          </sc-if>
          <sc-if value="{{o.isTeacher}}" hint-placeholder-val="{{false}}">
            <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="12" rx="2" fill="{{o.iconFill}}" opacity=".35"/><path d="M6 8h8M6 11h5" stroke="{{o.iconFill}}" stroke-width="2" stroke-linecap="round"/><path d="M8 21l4-5 4 5" stroke="{{o.iconFill}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </sc-if>
        </span>
        <span style="display:flex;flex-direction:column;gap:2px;text-align:left;flex:1">
          <span style="font-size:20px;line-height:26px;font-weight:900;color:#0A264F">{{o.title}}</span>
          <span style="font-size:15px;line-height:21px;font-weight:600;color:#3D5677">{{o.desc}}</span>
        </span>
        <span style="{{o.checkStyle}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
       </span>
       <span style="{{o.perkRowStyle}}">
        <sc-if value="{{o.isParent}}" hint-placeholder-val="{{true}}"><span style="display:flex;align-items:center;flex-shrink:0"><span style="width:28px;height:28px;border-radius:9999px;border:2px solid #FFFFFF;overflow:hidden;display:block;background:#D3E3F2;"><img src="/mascot/maro-peek.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 0;padding-top:16%;box-sizing:border-box;display:block"></span><span style="width:28px;height:28px;border-radius:9999px;border:2px solid #FFFFFF;overflow:hidden;display:block;background:#FBEBE8;margin-left:-8px"><img src="/mascot/maro-peek.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 0;padding-top:16%;box-sizing:border-box;display:block"></span><span style="width:28px;height:28px;border-radius:9999px;border:2px solid #FFFFFF;overflow:hidden;display:block;background:#E8F2E6;margin-left:-8px"><img src="/mascot/maro-peek.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 0;padding-top:16%;box-sizing:border-box;display:block"></span></span></sc-if>
        <sc-if value="{{o.isTeacher}}" hint-placeholder-val="{{false}}"><span style="width:28px;height:28px;border-radius:9999px;background:#9B7FD4;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span></sc-if>
        <span style="font-size:13px;line-height:18px;font-weight:800;color:#0A264F">{{o.example}}</span>
       </span>
      </button>
    </sc-for>
    <p style="margin:4px 4px 0;font-size:13px;line-height:18px;font-weight:700;color:#3D5677">Tipe akun tidak bisa diubah setelah dibuat. Akun guru tidak menyimpan data siswa.</p>
  </div>

  <!-- footer -->
  <div style="position:relative;margin-top:auto;padding:16px 20px 28px">
    <sc-if value="{{hasPick}}" hint-placeholder-val="{{true}}">
      <a href="Main.dc.html" class="press" style="height:56px;border-radius:16px;background:#D9654E;box-shadow:0 4px 0 #B24A34;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase">Lanjut</a>
    </sc-if>
    <sc-if value="{{noPick}}" hint-placeholder-val="{{false}}">
      <button disabled style="width:100%;height:56px;border:0;border-radius:16px;background:#E8EEF5;box-shadow:0 4px 0 #D5DEEA;color:#A3B1C4;font-family:inherit;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase">Lanjut</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { picked: 'parent' }; }
  renderVals() {
    const picked = this.state.picked;
    const base = [
      { id: 'parent', title: 'Orang Tua', desc: 'Bermain bersama si kecil di rumah. Bisa untuk beberapa anak.', example: 'Contoh: Rafi, Nara, dan Dimas main di satu akun, masing-masing punya level sendiri.' },
      { id: 'teacher', title: 'Guru', desc: 'Kegiatan seru di kelas. Cukup daftarkan kelasnya, tanpa data siswa.', example: 'Contoh: TK B Melati, 24 siswa. Yang tercatat hanya jumlah, bukan nama.' }
    ];
    const options = base.map((o) => {
      const on = picked === o.id;
      return Object.assign({}, o, {
        isParent: o.id === 'parent', isTeacher: o.id === 'teacher', pressed: on ? 'true' : 'false',
        pick: () => this.setState({ picked: on ? null : o.id }),
        iconFill: on ? '#FFFFFF' : '#E57B65',
        perkTick: on ? '#B24A34' : '#5C9FD6',
        perkRowStyle: 'display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding-top:12px;border-top:2px solid ' + (on ? '#F5B555' : '#E8EEF5'),
        cardStyle: 'display:flex;flex-direction:column;align-items:stretch;width:100%;padding:16px;border-radius:20px;font-family:inherit;text-align:left;' + (on ? 'background:#FFE8B6;border:2px solid #E57B65;box-shadow:0 4px 0 #E57B65' : 'background:#FFFFFF;border:2px solid #D5DEEA;box-shadow:0 4px 0 #D5DEEA'),
        tileStyle: 'width:56px;height:56px;flex-shrink:0;border-radius:9999px;display:flex;align-items:center;justify-content:center;transition:transform 200ms cubic-bezier(.34,1.56,.64,1);' + (on ? 'background:#E57B65;transform:scale(1.06)' : 'background:#FBEBE8'),
        checkStyle: 'width:28px;height:28px;flex-shrink:0;border-radius:9999px;display:flex;align-items:center;justify-content:center;transition:transform 200ms cubic-bezier(.34,1.56,.64,1);' + (on ? 'background:#22C55E;transform:scale(1)' : 'background:#22C55E;transform:scale(0)')
      });
    });
    return { options, hasPick: !!picked, noPick: !picked };
  }
}
</script>
</body>
</html>
