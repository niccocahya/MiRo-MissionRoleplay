<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Perayaan, misi selesai</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B24A34;text-decoration:none}a:hover{color:#8f3a28}
.press{transition:transform 80ms ease-out, box-shadow 80ms ease-out;cursor:pointer}
.press:active{transform:translateY(4px);box-shadow:none !important}
.snow{background-image:url(/mascot/snow.webp);background-size:cover;opacity:.45}
.pop{animation:pop 520ms cubic-bezier(.34,1.56,.64,1) both}
.rise{animation:rise 420ms cubic-bezier(.22,1,.36,1) both}
.cf{position:absolute;top:-20px;width:9px;height:14px;border-radius:3px;animation:fall 1.6s cubic-bezier(.3,.6,.5,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(420px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:linear-gradient(180deg,#A5CBEB 0%,#D3E3F2 60%,#E9DFCE 100%);font-family:Nunito, system-ui, sans-serif;color:#0A264F;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div class="snow" style="position:absolute;inset:0;pointer-events:none"></div>
  <!-- konfeti sekali jalan -->
  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none">
    <span class="cf" style="left:30px;background:#F1A22F;animation-delay:.3s"></span>
    <span class="cf" style="left:80px;background:#E57B65;animation-delay:.45s"></span>
    <span class="cf" style="left:130px;background:#FFFFFF;animation-delay:.35s"></span>
    <span class="cf" style="left:200px;background:#22C55E;animation-delay:.5s"></span>
    <span class="cf" style="left:250px;background:#F1A22F;animation-delay:.4s"></span>
    <span class="cf" style="left:300px;background:#0A264F;animation-delay:.55s"></span>
    <span class="cf" style="left:350px;background:#E57B65;animation-delay:.32s"></span>
  </div>

  <div class="pop" style="position:relative;height:236px;display:flex;align-items:flex-end;justify-content:center;padding-top:24px">
    <img src="/mascot/maro-chef-win.webp" alt="Maro bersorak dengan kostum koki" style="width:190px;height:234px;object-fit:contain">
  </div>

  <div class="rise" style="position:relative;padding:8px 20px 0;text-align:center;animation-delay:.35s">
    <h1 style="margin:0;font-size:40px;line-height:44px;font-weight:900;letter-spacing:-.02em">Misi selesai!</h1>
    <p style="margin:6px 0 0;font-size:17px;line-height:24px;font-weight:700;color:#1E467A">Rafi dan Nara jadi koki hebat hari ini.</p>
  </div>

  <!-- 3 stat -->
  <div style="position:relative;padding:22px 20px 0;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px">
    <div class="rise" style="background:#F1A22F;border-radius:16px;box-shadow:0 4px 0 #C67B0D;padding:3px;animation-delay:.9s">
      <div style="font-size:13px;font-weight:900;color:#0A264F;text-align:center;padding:4px 0 5px">XP</div>
      <div style="background:#FFFFFF;border-radius:13px;height:52px;display:flex;align-items:center;justify-content:center;gap:4px">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.5 2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8Z" fill="#F1A22F"/></svg>
        <span style="font-size:20px;font-weight:900;color:#8A5608;font-variant-numeric:tabular-nums">+25</span>
      </div>
    </div>
    <div class="rise" style="background:#6FA6D6;border-radius:16px;box-shadow:0 4px 0 #3D7FB8;padding:3px;animation-delay:1.02s">
      <div style="font-size:13px;font-weight:900;color:#0A264F;text-align:center;padding:4px 0 5px">Bermain</div>
      <div style="background:#FFFFFF;border-radius:13px;height:52px;display:flex;align-items:center;justify-content:center;gap:4px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D7FB8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg>
        <span style="font-size:20px;font-weight:900;color:#1E467A;font-variant-numeric:tabular-nums">15 mnt</span>
      </div>
    </div>
    <div class="rise" style="background:#E57B65;border-radius:16px;box-shadow:0 4px 0 #B24A34;padding:3px;animation-delay:1.14s">
      <div style="font-size:13px;font-weight:900;color:#0A264F;text-align:center;padding:4px 0 5px">Peserta</div>
      <div style="background:#FFFFFF;border-radius:13px;height:52px;display:flex;align-items:center;justify-content:center">
        <span style="width:34px;height:34px;border-radius:9999px;background:#D3E3F2;border:2px solid #FFFFFF;overflow:hidden;display:block"><img src="/mascot/maro-peek.webp" alt="Rafi" style="width:100%;height:100%;object-fit:cover;object-position:50% 0;padding-top:16%;box-sizing:border-box;display:block"></span>
        <span style="width:34px;height:34px;margin-left:-10px;border-radius:9999px;background:#FBEBE8;border:2px solid #FFFFFF;overflow:hidden;display:block"><img src="/mascot/maro-peek.webp" alt="Nara" style="width:100%;height:100%;object-fit:cover;object-position:50% 0;padding-top:16%;box-sizing:border-box;display:block"></span>
      </div>
    </div>
  </div>

  <!-- target harian + streak -->
  <div class="rise" style="position:relative;padding:16px 20px 0;animation-delay:1.6s">
    <div style="background:#FFFFFF;border:2px solid #D5DEEA;border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:12px">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20 8 17 21H7L4 8Z" fill="#6FA6D6"/><path d="M12 2 20 8 12 11 4 8Z" fill="#A5CBEB"/><path d="M12 11 17 21H7Z" fill="#3D7FB8"/><path d="M8 7.5 10.5 5.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:17px;font-weight:900">Target harian tercapai</span>
        <span style="font-size:13px;font-weight:700;color:#3D5677">Streak naik jadi 13 hari</span>
      </div>
      <span style="font-size:24px;font-weight:900;color:#3D7FB8;font-variant-numeric:tabular-nums">13</span>
    </div>
  </div>

  <!-- poin keahlian -->
  <div class="rise" style="position:relative;padding:14px 20px 0;display:flex;flex-direction:column;gap:8px;animation-delay:1.8s">
    <span style="font-size:15px;font-weight:900;color:#0A264F">Poin keahlian untuk Rafi dan Nara</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span style="display:flex;align-items:center;gap:6px;background:#FFFFFF;border:2px solid #A5CBEB;border-radius:9999px;padding:5px 12px 5px 6px;font-size:15px;font-weight:900">
        <span style="width:24px;height:24px;border-radius:9999px;background:#D3E3F2;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3D7FB8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10M10 9.5V4a1.5 1.5 0 0 1 3 0v6M13 10V5.5a1.5 1.5 0 0 1 3 0V12M16 9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7c-3 0-4.5-1.5-6.5-4L4 14.5a1.6 1.6 0 0 1 2.5-2L7 13"/></svg></span>Motorik +3</span>
      <span style="display:flex;align-items:center;gap:6px;background:#FFFFFF;border:2px solid #D5DEEA;border-radius:9999px;padding:5px 12px 5px 6px;font-size:15px;font-weight:900">
        <span style="width:24px;height:24px;border-radius:9999px;background:#E8EEF5;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0A264F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3A2.5 2.5 0 0 0 7 5.5 3 3 0 0 0 4.5 9a3 3 0 0 0 .5 5.5A3 3 0 0 0 9 19a2.5 2.5 0 0 0 3 1.5V4.5A2.5 2.5 0 0 0 9.5 3ZM14.5 3A2.5 2.5 0 0 1 17 5.5 3 3 0 0 1 19.5 9a3 3 0 0 1-.5 5.5A3 3 0 0 1 15 19a2.5 2.5 0 0 1-3 1.5"/></svg></span>Kognitif +2</span>
      <span style="display:flex;align-items:center;gap:6px;background:#FEF7EE;border:2px solid #F5B555;border-radius:9999px;padding:5px 12px;font-size:15px;font-weight:900;color:#8A5608">Lencana "Koki Rajin" 3/10</span>
    </div>
  </div>

  <div class="rise" style="position:relative;margin-top:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:6px;animation-delay:2s">
    <a href="Refleksi.dc.html" class="press" style="height:56px;border-radius:16px;background:#0A264F;box-shadow:0 4px 0 #04152E;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase">Lanjut</a>
    <a href="Profil.dc.html" style="height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#1E467A">Lihat perkembangan anak</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
