<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Profil, akun orang tua dan anak-anak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B24A34;text-decoration:none}a:hover{color:#8f3a28}
.press{transition:transform 80ms ease-out, box-shadow 80ms ease-out;cursor:pointer}
.press:active{transform:translateY(4px);box-shadow:none !important}
.popin{animation:popin 460ms cubic-bezier(.34,1.56,.64,1) both}
.grow-x{transform-origin:left center;animation:growx 900ms cubic-bezier(.22,1,.36,1) .35s both}
.grow-y{transform-origin:center bottom;animation:growy 700ms cubic-bezier(.22,1,.36,1) both}
.floaty{animation:floaty 2.4s ease-in-out .6s 3}
.pulse{animation:pulse 1.4s ease-in-out .9s 3}
.shine{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-12deg);animation:shine 1.1s ease-out .5s 1 both}
@keyframes popin{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes shine{to{left:130%}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F8FB;font-family:Nunito, system-ui, sans-serif;color:#0A264F;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div style="flex:1;min-height:0;overflow:hidden;padding:20px 20px 0;display:flex;flex-direction:column;gap:24px">

    <!-- header -->
    <div style="display:flex;align-items:center;gap:16px">
      <span style="width:72px;height:72px;flex-shrink:0;border-radius:9999px;background:#FBEBE8;border:3px solid #F4C6BC;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#B24A34">D</span>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <h1 style="margin:0;font-size:24px;line-height:30px;font-weight:900">Bunda Dinda</h1>
        <a href="UbahProfil.dc.html" class="press" style="display:flex;align-items:center;box-sizing:border-box;align-self:flex-start;height:36px;padding:0 12px;border-radius:12px;background:#FFFFFF;border:2px solid #D5DEEA;box-shadow:0 2px 0 #D5DEEA;font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#0A264F">Ubah profil</a>
      </div>
      <a href="Pengaturan.dc.html" aria-label="Pengaturan" class="press" style="box-sizing:border-box;width:44px;height:44px;border-radius:9999px;background:#FFFFFF;border:2px solid #D5DEEA;box-shadow:0 2px 0 #D5DEEA;display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A264F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </a>
    </div>

    <!-- ringkasan -->
    <div style="background:#FFE8B6;border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 #F1C97A;display:flex;flex-direction:column;gap:8px">
      <span style="font-size:20px;line-height:26px;font-weight:900;color:#0A264F">6 jam main bersama bulan ini</span>
      <span style="display:flex;align-items:center;gap:14px;font-size:13px;font-weight:800;color:#6B4307"><span style="display:flex;align-items:center;gap:5px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20 8 17 21H7L4 8Z" fill="#6FA6D6"/><path d="M12 2 20 8 12 11 4 8Z" fill="#A5CBEB"/></svg>13 hari streak</span><span>24 misi selesai</span><span>3 anak</span></span>
    </div>

    <!-- aktivitas minggu ini -->
    <div style="background:#FFFFFF;border:2px solid #D5DEEA;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:17px;font-weight:900">Main bersama minggu ini</span>
        <span style="font-size:13px;font-weight:800;color:#3D5677">90 menit</span>
      </div>
      <div role="img" aria-label="Menit bermain per hari: Senin 15, Selasa 30, Rabu 10, Kamis 25, Jumat 10 sejauh ini" style="display:flex;gap:6px"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="height:64px;width:100%;display:flex;align-items:flex-end;justify-content:center"><span class="grow-y" style="animation-delay:0.17s;width:22px;height:32px;border-radius:7px;background:#5C9FD6;display:block"></span></div><span style="font-size:12px;font-weight:700;color:#5B6F8A">S</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="height:64px;width:100%;display:flex;align-items:flex-end;justify-content:center"><span class="grow-y" style="animation-delay:0.24s;width:22px;height:64px;border-radius:7px;background:#5C9FD6;display:block"></span></div><span style="font-size:12px;font-weight:700;color:#5B6F8A">S</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="height:64px;width:100%;display:flex;align-items:flex-end;justify-content:center"><span class="grow-y" style="animation-delay:0.31s;width:22px;height:21px;border-radius:7px;background:#5C9FD6;display:block"></span></div><span style="font-size:12px;font-weight:700;color:#5B6F8A">R</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="height:64px;width:100%;display:flex;align-items:flex-end;justify-content:center"><span class="grow-y" style="animation-delay:0.38s;width:22px;height:53px;border-radius:7px;background:#5C9FD6;display:block"></span></div><span style="font-size:12px;font-weight:700;color:#5B6F8A">K</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="height:64px;width:100%;display:flex;align-items:flex-end;justify-content:center"><span class="grow-y" style="animation-delay:0.45s;width:22px;height:21px;border-radius:7px;background:#E57B65;display:block"></span></div><span style="font-size:12px;font-weight:900;color:#B24A34">J</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="height:64px;width:100%;display:flex;align-items:flex-end;justify-content:center"><span class="grow-y" style="animation-delay:0.52s;width:22px;height:6px;border-radius:7px;background:#E8EEF5;display:block"></span></div><span style="font-size:12px;font-weight:700;color:#5B6F8A">S</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="height:64px;width:100%;display:flex;align-items:flex-end;justify-content:center"><span class="grow-y" style="animation-delay:0.59s;width:22px;height:6px;border-radius:7px;background:#E8EEF5;display:block"></span></div><span style="font-size:12px;font-weight:700;color:#5B6F8A">M</span></div></div>
      <span style="font-size:13px;font-weight:700;color:#3D5677">Selasa jadi hari paling seru. Koki Kecil paling sering dimainkan.</span>
    </div>

    <!-- anak-anak -->
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:20px;line-height:26px;font-weight:900">Anak-anak</h2><a href="KelolaAnak.dc.html" style="height:44px;display:flex;align-items:center;font-size:15px;font-weight:900;color:#3D7FB8">Kelola</a></div>
      <sc-for list="{{kids}}" as="k" hint-placeholder-count="3">
        <a href="Perkembangan.dc.html" class="press" style="display:flex;align-items:center;gap:12px;background:#FFFFFF;border:2px solid #D5DEEA;border-radius:20px;box-shadow:0 4px 0 #D5DEEA;padding:10px 14px 10px 10px">
          <span style="{{k.avatarStyle}}"><img src="/mascot/maro-peek.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 0;padding-top:16%;box-sizing:border-box;display:block"></span>
          <span style="flex:1;display:flex;flex-direction:column;gap:6px">
            <span style="display:flex;justify-content:space-between;align-items:baseline">
              <span style="font-size:17px;font-weight:900;color:#0A264F">{{k.name}}</span>
              <span style="font-size:13px;font-weight:800;color:#8A5608">Level {{k.level}}</span>
            </span>
            <span style="height:12px;border-radius:9999px;background:#E8EEF5;overflow:hidden;display:block"><span style="{{k.barStyle}}"></span></span>
            <span style="font-size:13px;font-weight:700;color:#5B6F8A">{{k.xpLabel}}</span>
          </span>
        </a>
      </sc-for>
      <a href="KelolaAnak.dc.html" class="press" style="height:56px;border-radius:20px;border:2px dashed #A3B1C4;background:transparent;font-family:inherit;font-size:15px;font-weight:800;color:#3D5677;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D5677" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Kelola anak
      </a>
    </div>
  </div>

  <nav aria-label="Navigasi utama" style="height:80px;flex-shrink:0;background:#FFFFFF;border-top:2px solid #E8EEF5;display:flex;align-items:center;justify-content:space-around;padding:0 12px 6px;box-sizing:border-box">
    <a href="Main.dc.html" aria-label="Petualangan" style="width:56px;height:44px;display:flex;align-items:center;justify-content:center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A3B1C4" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5ZM9 4v13.5M15 6.5V20"/></svg>
    </a>
    <a href="Tantangan.dc.html" aria-label="Tantangan" style="width:56px;height:44px;display:flex;align-items:center;justify-content:center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A3B1C4" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="#A3B1C4"/></svg>
    </a>
    <a href="Memori.dc.html" aria-label="Memori" style="width:56px;height:44px;display:flex;align-items:center;justify-content:center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A3B1C4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="15" height="14" rx="2.5"/><path d="M21 8v11a2 2 0 0 1-2 2H7"/><path d="m3 16 4-4 4 4 2-2 5 5"/></svg>
    </a>
    <a href="Profil.dc.html" aria-label="Profil" aria-current="page" style="width:56px;height:44px;border-radius:14px;background:#FBEBE8;border:2px solid #F4C6BC;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
      <span style="width:30px;height:30px;border-radius:9999px;background:#E57B65;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#FFFFFF">D</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const kids = [
      { name: 'Rafi', level: 6, xp: 70, need: 140, bg: '#D3E3F2' },
      { name: 'Nara', level: 3, xp: 55, need: 80, bg: '#FBEBE8' },
      { name: 'Dimas', level: 8, xp: 30, need: 180, bg: '#E8F2E6' }
    ].map((k) => Object.assign({}, k, {
      avatarStyle: 'width:52px;height:52px;flex-shrink:0;border-radius:9999px;overflow:hidden;display:block;background:' + k.bg,
      barStyle: 'display:block;height:100%;border-radius:9999px;background:#F1A22F;width:' + Math.round(k.xp / k.need * 100) + '%',
      xpLabel: k.xp + ' / ' + k.need + ' XP ke level ' + (k.level + 1)
    }));
    return { kids };
  }
}
</script>
</body>
</html>
